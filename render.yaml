# Render Blueprint (ADR-008): free web service in Singapore, Postgres on Neon (not Render's DB).
# Render dashboard -> New -> Blueprint -> pick this repo. Values marked sync:false are entered there.
services:
  - type: web
    name: kritex-server
    runtime: docker
    plan: free # sleeps after ~15 min idle; switch to "starter" before taking real payments
    region: singapore
    branch: main # production always deploys main; ecommerce reaches prod by merging into main
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render's proxy sits in front of the app; needed so rate limits see the client IP.
      - key: TRUST_PROXY
        value: '1'
      - key: DATABASE_URL # Neon connection string (Singapore), ending in ?sslmode=require
        sync: false
      - key: CORS_ORIGIN # e.g. https://kritex.in,https://www.kritex.in,https://<project>.vercel.app
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL # public API origin, e.g. https://api.kritex.in
        sync: false
      - key: WEB_URL # storefront origin, e.g. https://kritex.in
        sync: false
      - key: AUTH_COOKIE_DOMAIN # e.g. .kritex.in
        sync: false
      # Continue with Google (optional, both or neither). Redirect URI: <BETTER_AUTH_URL>/api/v1/auth/callback/google
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Payments: production refuses the fake gateway, so these must be set (Razorpay test keys are fine for staging).
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET # dashboard webhook -> <api>/api/v1/webhooks/razorpay
        sync: false
      # Bank transfer for approved B2B buyers (all four, or leave unset to hide it).
      - key: BANK_TRANSFER_ACCOUNT_NAME
        sync: false
      - key: BANK_TRANSFER_ACCOUNT_NUMBER
        sync: false
      - key: BANK_TRANSFER_IFSC
        sync: false
      - key: BANK_TRANSFER_BANK_NAME
        sync: false
      # Email (OPS-1): without RESEND_API_KEY emails are only logged. MAIL_FROM's domain must be verified in Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM # e.g. Kritex <orders@kritex.in>
        sync: false
      # Staff alert for new quote requests (comma-separated; default kritex.jdp@gmail.com).
      - key: STAFF_ALERT_EMAILS
        sync: false
      # GST invoices (OPS-2): seller details printed on every invoice (confirm with the CA).
      - key: SELLER_LEGAL_NAME
        sync: false
      - key: SELLER_GSTIN
        sync: false
      - key: SELLER_ADDRESS # lines separated by |
        sync: false
      - key: BUSINESS_STATE_CODE # GST state code of the seller, e.g. 27
        sync: false
      # Shipping (OPS-3): optional. Without SHIPROCKET_EMAIL staff ship manually (courier + AWB).
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_PICKUP_LOCATION
        sync: false
      - key: SHIPROCKET_WEBHOOK_TOKEN # required when SHIPROCKET_EMAIL is set
        sync: false
