name: CI

on:
  push:
    branches: [main, ecommerce]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kritex
          POSTGRES_PASSWORD: kritex
          POSTGRES_DB: kritex_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U kritex -d kritex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://kritex:kritex@localhost:5434/kritex_test?schema=public
      # Only used by `prisma generate` / openapi export; tests force TEST_DATABASE_URL.
      DATABASE_URL: postgresql://kritex:kritex@localhost:5434/kritex_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - name: openapi.json is up to date
        run: npm run openapi:check
